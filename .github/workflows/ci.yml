name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker build -t tvc-dev docker/
      # Functional gate only. Timing measured on a GitHub-hosted runner is
      # diagnostic only and not accepted as published timing evidence
      # (see docs/methodology.md).
      # The jitter gate runs on the ProBook as make bench-gate in v0.1.
      - name: Functional gate
        run: >
          docker run --rm -v "$PWD":/w -w /w
          --cap-add=IPC_LOCK --ulimit memlock=-1:-1
          tvc-dev bash tests/ci.sh

  canonical-goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Canonical golden identity
        run: >
          scripts/check_canonical.sh
          ghcr.io/mamadou-wane/tvc-gold@sha256:77cfe56d943ef87fc8660c8e455127a9fe9fda5f96dc6bc0d804570b96a22d64
          "$RUNNER_TEMP/tvc-canonical"
